name: Deploy WORK Edition to GitHub Pages

on:
  push:
    branches: [personal-portfolio-redesign]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build WORK Edition
        run: |
          mkdir -p _site
          cp -R . _site
          cp _site/index.html _site/content.html
          python - <<'PY'
          from pathlib import Path
          p = Path('_site/work.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('src="index.html"', 'src="content.html"')
          p.write_text(s, encoding='utf-8')
          Path('_site/index.html').write_text(Path('_site/work.html').read_text(encoding='utf-8'), encoding='utf-8')
          PY
          rm -rf _site/_site _site/.git _site/.github

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
