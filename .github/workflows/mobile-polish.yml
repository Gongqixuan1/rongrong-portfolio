name: Mobile polish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Apply only requested visual fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '</style>'
          patch = r'''\n/* MOBILE + PORTFOLIO POLISH — requested visual fixes only */\n.welcome-title .type-text{max-width:100%;}\n.portfolio{background:transparent;padding:0;}\n.portfolio:before{display:none;}\n.book{min-height:650px;grid-template-columns:76px minmax(0,1fr) 76px;gap:10px;}\n.book-stage{height:650px;}\n.book-stage img{max-width:100%;max-height:650px;box-shadow:0 20px 45px #0b1f3a20;}\n.book-btn{border-color:#0b1f3a33;background:#ffffffcc;color:var(--ink);}\n.book-btn:hover{background:var(--orange);border-color:var(--orange);color:#fff;}\n@media(max-width:560px){\n  .welcome-in{width:100%;padding:20px 18px;}\n  .welcome-title{font-size:clamp(42px,12vw,70px);line-height:1.25;}\n  .type-text{display:block;width:auto;max-width:calc(100vw - 36px);margin:0 auto;white-space:normal;border-right:2px solid #fff;overflow:hidden;animation:mobileWelcomeTyping 2.8s steps(18,end) .35s forwards,mobileCursor .65s step-end infinite;}\n  .welcome-sub{white-space:normal;line-height:1.6;}\n  .quote{overflow:visible;}\n  .quote p{display:inline-block;width:auto;max-width:calc(100vw - 28px);white-space:normal;overflow:hidden;border-right:2px solid var(--orange);line-height:1.45;animation:mobileQuoteTyping 3.4s steps(21,end) .4s forwards,quoteBlink .65s step-end infinite;}\n  .portfolio{padding:0;margin-left:-4px;margin-right:-4px;}\n  .book{grid-template-columns:42px minmax(0,1fr) 42px;min-height:0;gap:4px;}\n  .book-stage{height:calc(100svh - 190px);min-height:360px;max-height:650px;}\n  .book-stage img{max-width:100%;max-height:100%;box-shadow:0 18px 38px #0b1f3a22;}\n  .book-btn{width:38px;height:38px;font-size:21px;}\n}\n@keyframes mobileWelcomeTyping{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}\n@keyframes mobileQuoteTyping{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}\n@keyframes mobileCursor{50%{border-color:transparent}}\n'''
          if '/* MOBILE + PORTFOLIO POLISH' not in s:
              s = s.replace(marker, patch + marker, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'fix: mobile welcome and portfolio spacing'
          git push
